name: build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0/12 * * *"
  push:
    branches:
      - main

jobs:
  build:
    if: github.repository_owner == 'autopkg'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Clone this repository
        uses: actions/checkout@v4
        with:
          path: main
          token: ${{ secrets.PAT_SECRET }}

      - name: Install Python dependencies
        working-directory: main
        run: pip3 install -r v1/requirements.txt

      - name: Clone AutoPkg org repos and rebuild search index
        working-directory: main
        env:
          PA_TOKEN: ${{ secrets.PAT_SECRET }}
        run: |
          mkdir -p repos
          python3 v1/build.py && cp v1/index.json index.json

      - name: Clone autopkg/autopkg repo
        working-directory: main
        run: |
          git clone --depth=1 https://github.com/autopkg/autopkg.git repos/autopkg/autopkg

      - name: Build processor index
        working-directory: main
        env:
          PA_TOKEN: ${{ secrets.PAT_SECRET }}
        run: |
          python3 v1/build_processors.py --autopkg-dir repos/autopkg/autopkg

      - name: Create or update latest release
        working-directory: main
        env:
          GH_TOKEN: ${{ secrets.PAT_SECRET }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest \
            --title "Latest Index" \
            --notes "Automatically rebuilt every 4 hours." \
            --latest \
            v1/index.json \
            v1/processors.json
